name: Windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run lint
      - run: bun run build
      - name: Install the packed npm package in a temporary prefix
        shell: pwsh
        run: |
          $packed = npm pack ./apps/cli --json --ignore-scripts --pack-destination $env:RUNNER_TEMP | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tarball = Join-Path $env:RUNNER_TEMP $packed[0].filename
          $prefix = Join-Path $env:RUNNER_TEMP 'jevgrep install'
          npm install --global --prefix $prefix --ignore-scripts --no-audit --no-fund $tarball
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $prefix 'jg.cmd') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "JEVGREP_TEST_CLI=$(Join-Path $prefix 'node_modules/@dzhng/jevgrep/dist/bin/index.js')" >> $env:GITHUB_ENV
      - name: Run portable suites against the installed CLI
        env:
          JEVGREP_TEST_IN_DOCKER: "1"
        run: bun test --timeout 30000 ./apps/cli/test ./packages/core/test ./test/discovery.test.ts ./test/evaluator.test.ts ./test/retrieval.test.ts ./test/retrieval-freshness.test.ts
      - run: node --test packages/core/test-node/provider-protocol.mjs
      - run: node --test test/skill.test.mjs
